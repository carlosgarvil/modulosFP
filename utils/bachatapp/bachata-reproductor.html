<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bachata · Reproductor</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eef6ff;background:#080e1b}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{background:#203650;border:1px solid #42607f;color:#fff;border-radius:12px;padding:11px 17px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#0c917c;border-color:#35c8ad}.app{min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:clamp(10px,2vw,24px)}.top,.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.top label{display:inline-flex;align-items:center;gap:8px;border:1px solid #36506b;background:#17263b;padding:9px 12px;border-radius:10px;cursor:pointer}.top input[type=file]{max-width:180px;font-size:12px}.name{font-size:13px;color:#aac0d5;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stage{min-height:0;display:grid;grid-template-columns:minmax(0,.7fr) minmax(300px,1.6fr);align-items:center;gap:10px;border:1px solid #263c55;border-radius:22px;background:radial-gradient(circle at 70% 45%,#16344c,#0d192b 55%,#0a1323);overflow:hidden}.count{text-align:center;align-self:center}.number{font-size:clamp(150px,25vw,520px);font-weight:900;line-height:.85;letter-spacing:-.08em;color:#47dec1;text-shadow:0 12px 75px #16a68c55}.number.waiting{color:#77899e;text-shadow:none}.countHint{margin-top:16px;font-size:clamp(15px,2vw,24px);color:#b5c8db}.figureWrap{height:min(70vh,700px);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}.direction{font-weight:700;font-size:clamp(15px,2vw,24px);letter-spacing:.06em;text-transform:uppercase;color:#b5c8db;min-height:1.3em}.figRow{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(4px,2vw,32px)}.figure{flex:0 1 470px;min-width:0;height:92%;overflow:visible}.arrow{flex:none;width:clamp(46px,9vw,150px);height:auto;fill:#47dec1;opacity:.08;transition:fill .15s}.arrow.tap{fill:#ffce80}.fig{--skin:#e3ebf4;--shirt:#6f82dc;--pants:#5a7592;--edge:rgba(8,14,27,.7)}.limb{fill:none;stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.leg{stroke:var(--pants);stroke-width:18}.arm{stroke-width:12;filter:drop-shadow(0 0 2px var(--edge))}.sleeve{stroke:var(--shirt);stroke-width:17;filter:drop-shadow(0 0 2px var(--edge))}.neck{stroke-width:14}.torso{fill:var(--shirt);stroke:var(--shirt);stroke-width:10;stroke-linejoin:round}.head{fill:var(--skin)}.foot{stroke:#9fb3c8;stroke-width:12;stroke-linecap:round;transition:stroke .15s}.foot.step{stroke:#47dec1}.foot.tap{stroke:#ffce80}.controls{padding:3px 0 10px}.seek{width:min(760px,80vw);accent-color:#39cdb0}.time{font-variant-numeric:tabular-nums;color:#b5c8db;min-width:58px;text-align:center}.status{width:100%;min-height:20px;text-align:center;font-size:14px;color:#a9c1d5}.small{font-size:13px;color:#a9c1d5}.speed{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#b5c8db}.speed select{font:inherit;background:#203650;border:1px solid #42607f;color:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}@media(max-width:750px){.stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(190px,.8fr)}.number{font-size:clamp(150px,38vh,420px)}.figureWrap{height:100%;min-height:170px}.figure{height:88%;max-width:320px}.arrow{width:clamp(40px,13vw,90px)}.countHint{margin-top:4px}.top input[type=file]{max-width:125px}}
</style>
</head>
<body>
<main class="app">
 <header class="top">
  <a href="bachata-editor.html" style="color:#47dec1">Editor de tiempos →</a>
  <label>🎵 MP3 <input id="audioFile" type="file" accept="audio/*,.mp3"></label><span id="audioName" class="name">Sin audio</span>
  <label>🗂️ JSON <input id="jsonFile" type="file" accept=".json,application/json"></label><span id="jsonName" class="name">Sin marcas</span>
 </header>
 <section class="stage" aria-label="Conteo y pasos">
  <div class="count"><div id="number" class="number waiting" aria-live="off">—</div><div id="countHint" class="countHint">Carga el MP3 y el JSON</div></div>
  <div class="figureWrap"><div id="direction" class="direction">Preparado</div>
   <div class="figRow">
   <svg id="arrowL" class="arrow" viewBox="0 0 100 160" aria-hidden="true"><path d="M96 52H46V14L4 80l42 66v-38h50z"/></svg>
   <svg class="figure" viewBox="0 30 400 375" role="img" aria-label="Figura que muestra los pasos de bachata">
    <defs><linearGradient id="floorGrad" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="390" y2="0"><stop offset="0" stop-color="#587087" stop-opacity="0"/><stop offset=".5" stop-color="#587087" stop-opacity=".9"/><stop offset="1" stop-color="#587087" stop-opacity="0"/></linearGradient></defs>
    <line x1="10" y1="391" x2="390" y2="391" stroke="url(#floorGrad)" stroke-width="2"/>
    <ellipse id="shadow" cx="200" cy="391" rx="62" ry="7" fill="#000" opacity=".28"/>
    <ellipse id="stepGlow" cx="200" cy="390" rx="28" ry="6" fill="#47dec1" opacity="0"/>
    <g class="fig">
     <path id="legL" class="limb leg"/><path id="legR" class="limb leg"/>
     <line id="neck" class="limb neck"/>
     <path id="torso" class="torso"/>
     <path id="armL" class="limb arm"/><path id="armR" class="limb arm"/>
     <path id="sleeveL" class="limb sleeve"/><path id="sleeveR" class="limb sleeve"/><circle id="head" class="head" r="23"/>
     <line id="footL" class="foot"/><line id="footR" class="foot"/>
    </g>
   </svg>
   <svg id="arrowR" class="arrow" viewBox="0 0 100 160" aria-hidden="true"><path d="M4 52h50V14l42 66-42 66v-38H4z"/></svg>
  </div>
  </div>
 </section>
 <footer class="controls">
  <button id="back" aria-label="Retroceder 5 segundos">↶ 5 s</button><button id="play" class="primary" disabled>▶ Reproducir</button><button id="forward" aria-label="Avanzar 5 segundos">5 s ↷</button>
  <label class="speed">Velocidad <select id="speed" aria-label="Velocidad de reproducción"><option value="1" selected>100 %</option><option value="0.9">90 %</option><option value="0.8">80 %</option><option value="0.7">70 %</option><option value="0.6">60 %</option><option value="0.5">50 %</option></select></label>
  <div class="controls" style="width:100%"><span id="current" class="time">0:00</span><input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Posición del audio"><span id="duration" class="time">0:00</span></div>
  <div id="status" class="status" role="status">El conteo comenzará en el primer «1» marcado.</div>
 </footer>
</main>
<audio id="audio" preload="metadata"></audio>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),audio=$('audio');
let markers=[],cycles=[],audioUrl=null,lastBeatKey='',lastStatus='';
const duration=()=>Number.isFinite(audio.duration)?audio.duration:0;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function status(message){if(message!==lastStatus){$('status').textContent=message;lastStatus=message}}
function tempoMap(ms){ // ms ordenadas. Cada tramo entre dos «1» define su propia velocidad.
 const n=ms.length,cycles=new Array(n).fill(0),turns=new Array(n).fill(0),gaps=ms.slice(0,-1).map((m,i)=>ms[i+1].time-m.time),minGap=gaps.length?Math.min(...gaps):0;let ref=0;
 for(let i=0;i<n;i++){
  if(ms[i].cycle>0)cycles[i]=ms[i].cycle; // duración fijada a mano
  else if(i<n-1){const k=Math.max(1,Math.round(gaps[i]/(ref||minGap)));cycles[i]=gaps[i]/k;turns[i]=k} // vueltas que caben hasta el siguiente «1»
  else cycles[i]=ref; // última marca: se mantiene el último ritmo
  if(cycles[i]>0)ref=cycles[i];
 }
 return {cycles,turns};
}
function beatAt(t){
 if(!markers.length||t<markers[0].time)return null;
 let i=markers.length-1;while(i>0&&t<markers[i].time)i--;
 const cycle=cycles[i],steps=markers[i].steps;if(cycle<=0)return {beat:1,steps,cycle:0,bar:0,phase:0,marker:i};
 const interval=cycle/steps,raw=Math.floor((t-markers[i].time)/interval+1e-7);
 return {beat:raw%steps+1,steps,cycle,bar:Math.floor(raw/steps),phase:(t-markers[i].time)/interval-raw,marker:i};
}
// ---- Figura: silueta con peso, rodillas, cadera y transición suave entre tiempos ----
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const HIP_Y=234,ANKLE_Y=372,HIP_W=16;
const NEUTRAL={lx:183,rx:217,support:null,tap:null,mover:null};
const stepIndex=b=>b.steps===8?b.beat-1:(b.bar%2)*4+b.beat-1; // 0-3 izquierda, 4-7 derecha
function stepState(idx){
 const S=40,W=17,goingLeft=idx<4,k=idx%4,dir=goingLeft?-1:1,o=goingLeft?258:142;
 let lead=o+dir*W+dir*S,trail=o-dir*W; // 1: paso con el pie guía
 if(k>=1)trail+=dir*S; // 2: cierre
 if(k>=2)lead+=dir*S;  // 3: paso
 if(k>=3)trail+=dir*S; // 4: punta junto al pie de apoyo
 const L=goingLeft?'L':'R',T=goingLeft?'R':'L';
 return {lx:goingLeft?lead:trail,rx:goingLeft?trail:lead,support:k===1?T:L,tap:k===3?T:null,mover:k%2===0?L:T,open:k%2===0};
}
function shape(s){
 const sup=s.support==='L'?s.lx:s.support==='R'?s.rx:(s.lx+s.rx)/2,oth=s.support==='L'?s.rx:s.support==='R'?s.lx:sup;
 // En el paso abierto (1/3/5/7) la cadera se queda cerca del pie que no se mueve, para que esa pierna siga casi recta
 const w=s.open?.35:.72;
 let px=sup*w+oth*(1-w),drop=0;
 if(s.tap){px+=s.tap==='R'?-3:3;drop=s.tap==='R'?9:-9} // golpe de cadera en la punta (sin pasar el pie de apoyo)
 return {lx:s.lx,rx:s.rx,px,drop,tl:s.tap==='L'?1:0,tr:s.tap==='R'?1:0};
}
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,n=v=>v.toFixed(1);
// Pierna casi recta: la rodilla solo se desplaza un poco (máx. ~10 px) al levantar el pie o marcar la punta
function legPath(hx,hy,ax,ay,inward,bend){
 const dx=ax-hx,dy=ay-hy,d=Math.hypot(dx,dy)||1;
 let nx=-dy/d,ny=dx/d;if(nx*inward<0){nx=-nx;ny=-ny}
 return `M${n(hx)} ${n(hy)}L${n(hx+dx*.48+nx*bend)} ${n(hy+dy*.48+ny*bend)}L${n(ax)} ${n(ay)}`;
}
function setFoot(el,ax,ay,tap,out){
 const x1=lerp(ax+out*12,ax,tap),y1=lerp(ay+13,ay+7,tap),x2=lerp(ax-out*8,ax+out*3,tap),y2=lerp(ay+13,ay+19,tap);
 el.setAttribute('x1',n(x1));el.setAttribute('y1',n(y1));el.setAttribute('x2',n(x2));el.setAttribute('y2',n(y2));
}
function updateDirection(b){
 if(!b){$('direction').textContent='Preparado';return}
 const idx=stepIndex(b),side=idx<4?'← Izquierda':'Derecha →';
 $('direction').textContent=idx%4===3?`${side} · punta`:side;
}
function drawFigure(b){
 let cur=NEUTRAL,next=NEUTRAL,t=0,p=0;
 if(b){const idx=stepIndex(b);cur=stepState(idx);next=stepState((idx+1)%8);p=b.cycle?b.phase:0;if(!reduceMotion&&p>.5)t=ease((p-.5)/.5)}
 const A=shape(cur),B=shape(next),arc=Math.sin(Math.PI*t);
 const lx=lerp(A.lx,B.lx,t),rx=lerp(A.rx,B.rx,t),px=lerp(A.px,B.px,t),drop=lerp(A.drop,B.drop,t),tl=lerp(A.tl,B.tl,t),tr=lerp(A.tr,B.tr,t);
 const liftL=Math.abs(B.lx-A.lx)>1?arc*10:0,liftR=Math.abs(B.rx-A.rx)>1?arc*10:0;
 const aly=ANKLE_Y-liftL-tl*9,ary=ANKLE_Y-liftR-tr*9;
 const py=HIP_Y+arc*3,hly=py-drop,hry=py+drop;
 $('legL').setAttribute('d',legPath(px-HIP_W,hly,lx,aly,1,liftL*.5+tl*8));$('legR').setAttribute('d',legPath(px+HIP_W,hry,rx,ary,-1,liftR*.5+tr*8));
 setFoot($('footL'),lx,aly,tl,-1);setFoot($('footR'),rx,ary,tr,1);
 const mid=(lx+rx)/2,shx=mid+(px-mid)*.4,sly=120+drop*.45,sry=120-drop*.45,wx=(shx+px)/2,sway=(px-mid)*.12;
 $('torso').setAttribute('d',`M${n(shx-33)} ${n(sly)}L${n(wx-20)} 196L${n(px-27)} ${n(hly+6)}L${n(px+27)} ${n(hry+6)}L${n(wx+20)} 196L${n(shx+33)} ${n(sry)}Z`);
 const hx=shx+(shx-px)*.2;
 $('neck').setAttribute('x1',n(shx));$('neck').setAttribute('y1','118');$('neck').setAttribute('x2',n(hx));$('neck').setAttribute('y2','94');
 $('head').setAttribute('cx',n(hx));$('head').setAttribute('cy','72');
 for(const [id,sl,s,sy] of [['armL','sleeveL',-1,sly],['armR','sleeveR',1,sry]]){
  const sx=shx+s*31,ey=sy+62,ex=sx+s*12-sway;
  $(id).setAttribute('d',`M${n(sx)} ${n(sy+6)}L${n(ex)} ${n(ey)}L${n(ex-s*14)} ${n(ey+22)}`);
  $(sl).setAttribute('d',`M${n(sx)} ${n(sy+6)}L${n(sx+(ex-sx)*.38)} ${n(sy+6+(ey-sy-6)*.38)}`); // manga corta
 }
 $('shadow').setAttribute('cx',n(px));
 const glow=$('stepGlow');
 if(b&&cur.mover){glow.setAttribute('cx',n(cur.mover==='L'?A.lx:A.rx));glow.setAttribute('fill',cur.tap?'#ffce80':'#47dec1');glow.setAttribute('opacity',n(b.cycle?Math.max(0,1-p*1.6)*.55:.4))}
 else glow.setAttribute('opacity','0');
 $('footL').classList.toggle('tap',cur.tap==='L');$('footR').classList.toggle('tap',cur.tap==='R');
 $('footL').classList.toggle('step',!!b&&cur.mover==='L'&&!cur.tap);$('footR').classList.toggle('step',!!b&&cur.mover==='R'&&!cur.tap);
}
function drawArrows(b){ // la flecha del lado al que va el cuerpo late en cada tiempo; en la punta se anuncia el cambio
 const L=$('arrowL'),R=$('arrowR');
 if(!b){for(const a of [L,R]){a.style.opacity='.08';a.style.transform='';a.classList.remove('tap')}return}
 const idx=stepIndex(b),k=idx%4,goLeft=idx<4,on=goLeft?L:R,off=goLeft?R:L,p=b.cycle?b.phase:0;
 const pulse=reduceMotion||!b.cycle?1:(1-p)**1.4,shift=reduceMotion?0:(goLeft?-1:1)*14*(1-p);
 on.style.opacity=n(.22+.78*pulse);on.style.transform=`translateX(${n(shift)}px)`;on.classList.toggle('tap',k===3);
 off.style.opacity=n(k===3&&!reduceMotion&&p>.5?.08+.5*(p-.5)/.5:.08);off.style.transform='';off.classList.remove('tap');
}
function render(){
 const b=beatAt(audio.currentTime),key=b?`${b.marker}:${b.bar}:${b.beat}`:'';
 $('number').textContent=b?b.beat:'—';$('number').classList.toggle('waiting',!b);
 if(key!==lastBeatKey){updateDirection(b);lastBeatKey=key}
 drawFigure(b);drawArrows(b);
 $('countHint').textContent=!markers.length?'Carga el JSON de marcas':audio.currentTime<markers[0].time?'Esperando el primer «1»':b?.cycle?'Sigue el ritmo':'Indica otra marca o la duración de una vuelta';
 $('current').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(duration());$('seek').value=duration()?Math.round(audio.currentTime/duration()*1000):0;
 requestAnimationFrame(render);
}
$('audioFile').onchange=e=>{const file=e.target.files[0];if(!file)return;audio.pause();if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(file);audio.src=audioUrl;$('audioName').textContent=file.name;$('play').disabled=false;status('Audio cargado.');};
$('jsonFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{
 const data=JSON.parse(await file.text());if(!Array.isArray(data.markers)||!data.markers.length)throw Error('El JSON no contiene marcas.');
 const next=data.markers.map(m=>({time:Number(m.time),steps:Number(m.steps??8),cycle:m.cycle==null?null:Number(m.cycle)})).sort((a,b)=>a.time-b.time);
 if(next.some((m,i)=>!Number.isFinite(m.time)||m.time<0||![4,8].includes(m.steps)||m.cycle!==null&&(!Number.isFinite(m.cycle)||m.cycle<=0)||i&&m.time<=next[i-1].time))throw Error('El JSON contiene marcas no válidas.');
 markers=next;cycles=tempoMap(markers).cycles;lastBeatKey='';$('jsonName').textContent=file.name;status(`${markers.length} marcas cargadas.`);
 }catch(error){status(error.message||'No se pudo leer el JSON.')}e.target.value=''};
function toggle(){if(!audio.src)return;if(audio.paused)audio.play().catch(()=>status('No se pudo reproducir el audio.'));else audio.pause()}
$('play').onclick=toggle;$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('forward').onclick=()=>audio.currentTime=Math.min(duration(),audio.currentTime+5);
$('seek').oninput=e=>{if(duration())audio.currentTime=Number(e.target.value)/1000*duration()};
function applySpeed(){const r=Number($('speed').value)||1;audio.defaultPlaybackRate=r;audio.playbackRate=r;audio.preservesPitch=true}
$('speed').onchange=()=>{applySpeed();$('speed').blur();status(`Velocidad: ${Math.round(audio.playbackRate*100)} %`)};
audio.addEventListener('loadedmetadata',applySpeed); // al cargar otro MP3 se conserva la velocidad elegida
audio.onplay=()=>$('play').textContent='⏸ Pausar';audio.onpause=()=>$('play').textContent='▶ Reproducir';
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();toggle()}});
updateDirection(null);render();
})();
</script>
</body>
</html>
