<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de comportamiento del aula</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212b; background: #fff; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 360px; padding: 6px; background: #fff; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    .mode { width: 100%; min-height: 38px; border: 0; border-radius: 6px; font-weight: 800; color: white; }
    .mode.quiet { background: #9b1c1c; }
    .mode.talk { background: #176b42; }
    .toolbar { display: flex; gap: 5px; margin: 5px 0; }
    .toolbar button { flex: 1; min-height: 30px; border: 1px solid #b8c1cc; border-radius: 5px; background: white; font-size: 12px; }
    .editor { display: none; margin-bottom: 5px; }
    .editor.open { display: block; }
    textarea { display: block; width: 100%; min-height: 100px; resize: vertical; border: 1px solid #aab5c2; border-radius: 5px; padding: 5px; font-size: 14px; }
    .editor button { margin-top: 4px; padding: 5px 10px; }
    .code-box { display: flex; gap: 4px; margin: 6px 0; }
    .code-box input { min-width: 0; flex: 1; padding: 6px; border: 1px solid #aab5c2; border-radius: 5px; }
    .code-box button { padding: 5px 8px; }
    .hint, .status { margin: 4px 0; font-size: 12px; color: #596575; }
    .status { min-height: 18px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 28px; align-items: center; gap: 4px; min-height: 29px; padding: 1px 3px; border-bottom: 1px solid #d9dfe6; cursor: pointer; }
    .row:focus-visible { outline: 2px solid #176b42; outline-offset: -2px; }
    .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 650; }
    .battery { display: flex; gap: 2px; align-items: center; width: 92px; height: 25px; padding: 3px; border: 2px solid #465565; border-radius: 4px; background: white; }
    .segment { flex: 1; height: 100%; border-radius: 1px; background: #dce2e8; }
    .battery[data-level="1"] .segment:nth-child(-n+1) { background: #238a4b; }
    .battery[data-level="2"] .segment:nth-child(-n+2) { background: #d7a900; }
    .battery[data-level="3"] .segment:nth-child(-n+3) { background: #df741c; }
    .battery[data-level="4"] { border-color: #aa1515; background: #aa1515; }
    .battery[data-level="4"] .segment { background: #ff6b6b; }
    .back { border: 0; background: transparent; font-size: 19px; line-height: 1; padding: 0; }
    .row.level4 { background: #fff0f0; }
    .empty { margin: 10px 3px; font-size: 13px; color: #596575; }
  </style>
</head>
<body>
  <button id="mode" class="mode quiet" type="button"></button>
  <div class="code-box">
    <input id="code" type="password" autocomplete="off" placeholder="Código de la clase" aria-label="Código de la clase">
    <button id="unlock" type="button">Cargar</button>
  </div>
  <p id="status" class="status" role="status"></p>
  <div class="toolbar">
    <button id="edit" type="button" aria-expanded="false">✏️ Alumnos</button>
    <button id="reset" type="button">Reiniciar clase</button>
  </div>
  <div id="editor" class="editor">
    <label for="names">Un alumno por línea</label>
    <textarea id="names" placeholder="Ana García&#10;Luis Pérez"></textarea>
    <p class="hint">Introduce primero el código. La lista se guardará cifrada en este navegador.</p>
    <button id="load" type="button">Guardar lista cifrada</button>
  </div>
  <main id="list" aria-live="polite"></main>
  <script>
    (() => {
      'use strict';
      const KEY = 'control_comportamiento_aula_v3_encrypted';
      const LEVEL_KEY = 'control_comportamiento_aula_v3_levels';
      try { sessionStorage.removeItem('control_comportamiento_aula_v2'); } catch (_) {}
      const $ = id => document.getElementById(id);
      let state = { quiet: true, students: [] };
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const toBase64 = bytes => btoa(String.fromCharCode(...bytes));
      const fromBase64 = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
      const showStatus = message => { $('status').textContent = message; };
      const save = () => {
        try { sessionStorage.setItem(LEVEL_KEY, JSON.stringify({ rosterIndex: state.rosterIndex, quiet: state.quiet, levels: state.students.map(s => s.level) })); } catch (_) {}
      };
      async function deriveKey(code, salt) {
        const material = await crypto.subtle.importKey('raw', encoder.encode(code), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
          material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
      }
      async function encryptNames(names, code) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(code, salt);
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoder.encode(JSON.stringify(names)));
        return JSON.stringify({ version: 1, salt: toBase64(salt), iv: toBase64(iv), data: toBase64(new Uint8Array(encrypted)) });
      }
      async function decryptNames(record, code) {
        const payload = JSON.parse(record);
        if (payload.version !== 1) throw new Error('Formato desconocido');
        const key = await deriveKey(code, fromBase64(payload.salt));
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(payload.iv) }, key, fromBase64(payload.data));
        const names = JSON.parse(decoder.decode(plain));
        if (!Array.isArray(names) || !names.every(name => typeof name === 'string')) throw new Error('Lista no válida');
        return names;
      }
      const storedRecords = () => {
        try { const records = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(records) ? records : []; }
        catch (_) { return []; }
      };
      async function findRecord(records, code) {
        for (let index = 0; index < records.length; index++) {
          try { return { index, names: await decryptNames(records[index], code) }; } catch (_) {}
        }
        return null;
      }
      function render() {
        const mode = $('mode');
        mode.textContent = state.quiet ? '🔇 SILENCIO ABSOLUTO' : '🗣️ CONVERSACIÓN MODERADA';
        mode.className = 'mode ' + (state.quiet ? 'quiet' : 'talk');
        mode.setAttribute('aria-pressed', String(!state.quiet));
        const list = $('list');
        list.replaceChildren();
        if (!state.students.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'Introduce el código para cargar la clase o pulsa «Alumnos» para crear una lista.';
          list.append(empty);
        }
        state.students.forEach((student, index) => {
          const row = document.createElement('div');
          row.className = 'row' + (student.level === 4 ? ' level4' : '');
          row.tabIndex = 0;
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', `${student.name}: nivel ${student.level} de 4. Pulsar para subir`);
          row.addEventListener('click', () => changeLevel(index, 1));
          row.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); changeLevel(index, 1); }
          });
          const name = document.createElement('span');
          name.className = 'name'; name.textContent = student.name; name.title = student.name;
          const battery = document.createElement('span');
          battery.className = 'battery';
          battery.dataset.level = student.level;
          battery.setAttribute('aria-hidden', 'true');
          for (let i = 0; i < 4; i++) { const segment = document.createElement('span'); segment.className = 'segment'; battery.append(segment); }
          const back = document.createElement('button');
          back.type = 'button'; back.className = 'back'; back.textContent = '↩️';
          back.setAttribute('aria-label', `${student.name}: retroceder un nivel`);
          back.addEventListener('click', event => { event.stopPropagation(); changeLevel(index, -1); });
          back.addEventListener('keydown', event => { event.stopPropagation(); });
          row.append(name, battery, back); list.append(row);
        });
      }
      function changeLevel(index, amount) {
        state.students[index].level = Math.min(4, Math.max(1, state.students[index].level + amount));
        save(); render();
      }
      $('mode').addEventListener('click', () => { state.quiet = !state.quiet; save(); render(); });
      $('edit').addEventListener('click', () => {
        const open = $('editor').classList.toggle('open');
        $('edit').setAttribute('aria-expanded', String(open));
        if (open) { $('names').value = state.students.map(s => s.name).join('\n'); $('names').focus(); }
      });
      $('unlock').addEventListener('click', async () => {
        const code = $('code').value;
        if (!code) { showStatus('Introduce el código de la clase.'); return; }
        const records = storedRecords();
        if (!records.length) { showStatus('Aún no hay una lista guardada en este navegador. Pulsa «Alumnos» para crearla.'); return; }
        try {
          const match = await findRecord(records, code);
          if (!match) throw new Error('Código incorrecto');
          const { names, index: rosterIndex } = match;
          let saved = {};
          try { saved = JSON.parse(sessionStorage.getItem(LEVEL_KEY)) || {}; } catch (_) {}
          state.quiet = saved.rosterIndex === rosterIndex ? saved.quiet !== false : true;
          state.students = names.map((name, index) => ({ name, level: Math.min(4, Math.max(1, Number(saved.rosterIndex === rosterIndex ? saved.levels?.[index] : 1) || 1)) }));
          state.rosterIndex = rosterIndex;
          $('code').value = '';
          save(); render(); showStatus(`${names.length} alumnos cargados.`);
        } catch (_) { showStatus('Código incorrecto o datos cifrados dañados.'); }
      });
      $('code').addEventListener('keydown', event => { if (event.key === 'Enter') $('unlock').click(); });
      $('load').addEventListener('click', async () => {
        const code = $('code').value;
        const names = $('names').value.split(/\r?\n/).map(n => n.trim()).filter(Boolean);
        if (!code || !names.length) { showStatus('Introduce un código y al menos un nombre.'); return; }
        try {
          const records = storedRecords();
          const match = await findRecord(records, code);
          const encrypted = await encryptNames(names, code);
          const rosterIndex = match ? match.index : records.length;
          records[rosterIndex] = encrypted;
          localStorage.setItem(KEY, JSON.stringify(records));
          const oldLevels = new Map(state.students.map(s => [s.name, s.level]));
          state.students = names.map(name => ({ name, level: oldLevels.get(name) || 1 }));
          state.rosterIndex = rosterIndex;
          $('code').value = '';
          save(); render(); $('editor').classList.remove('open'); $('edit').setAttribute('aria-expanded', 'false');
          showStatus(`${names.length} alumnos guardados con cifrado.`);
        } catch (_) { showStatus('No se pudo cifrar o guardar la lista en este navegador.'); }
      });
      $('reset').addEventListener('click', () => {
        state.students.forEach(student => { student.level = 1; });
        save(); render();
      });
      render();
    })();
  </script>
</body>
</html>
